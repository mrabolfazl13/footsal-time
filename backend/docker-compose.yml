version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: footsal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/footsal_db
    depends_on:
      - db
      - redis

volumes:
  postgres_data: