version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: footsal_postgres
    restart: always
    environment:
      POSTGRES_DB: footsal_db
      POSTGRES_USER: footsal_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footsal_user -d footsal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: footsal_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: footsal_web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data: